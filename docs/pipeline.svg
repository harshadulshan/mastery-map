<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="How a practice set is made: answers feed the mastery model (Best-LR plus recency), which gives each student&#x27;s chance on every skill; weak spots and weak prerequisites follow; practice sets put 70% of the questions on near-miss skills and come as a PDF with an answer key; the term can be replayed and the next weeks played forward." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How a practice set is made</title>
<style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="999" height="239" rx="14" fill="#0d1117" stroke="#30363d"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8b949e"/></marker></defs><rect width="0" height="0"><animate id="t" attributeName="width" from="0" to="0" dur="10.0s" begin="0s;t.end"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0200;0.0550;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="24" y="70" width="160" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".75"/><text x="36" y="92" font-size="14" font-weight="700" fill="#e6edf3">Answers</text><text x="36" y="109" font-size="11.5" fill="#8b949e">quizzes, homework:</text><text x="36" y="123" font-size="11.5" fill="#8b949e">student, question, ✓/✗</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1000;0.1350;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="210" y="70" width="176" height="62" rx="10" fill="#161b22" stroke="#a371f7" stroke-opacity=".75"/><text x="222" y="92" font-size="14" font-weight="700" fill="#e6edf3">Mastery model</text><text x="222" y="109" font-size="11.5" fill="#8b949e">Best-LR + recency;</text><text x="222" y="123" font-size="11.5" fill="#8b949e">chance on every skill</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2350;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="412" y="70" width="186" height="62" rx="10" fill="#161b22" stroke="#f85149" stroke-opacity=".75"/><text x="424" y="92" font-size="14" font-weight="700" fill="#e6edf3">Weak spots</text><text x="424" y="109" font-size="11.5" fill="#8b949e">and the weak prerequisites</text><text x="424" y="123" font-size="11.5" fill="#8b949e">behind them</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3350;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="624" y="70" width="170" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity=".75"/><text x="636" y="92" font-size="14" font-weight="700" fill="#e6edf3">Practice sets</text><text x="636" y="109" font-size="11.5" fill="#8b949e">70% near-miss skills;</text><text x="636" y="123" font-size="11.5" fill="#8b949e">PDF with answer key</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3800;0.4150;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="820" y="70" width="156" height="62" rx="10" fill="#161b22" stroke="#3fb950" stroke-opacity=".75"/><text x="832" y="92" font-size="14" font-weight="700" fill="#e6edf3">Replay, what if</text><text x="832" y="109" font-size="11.5" fill="#8b949e">the term week by</text><text x="832" y="123" font-size="11.5" fill="#8b949e">week; next weeks</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0800;0.1100;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M184 101 L206 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1800;0.2100;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M386 101 L408 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2800;0.3100;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M598 101 L620 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3600;0.3900;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M794 101 L816 101" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4400;0.4700;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M710 132 C710 190 300 190 298 136" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="500" y="186" text-anchor="middle" font-size="11.5" fill="#8b949e">next week's answers come back in: the estimates sharpen</text></g>
<text x="24" y="34" font-size="13" font-weight="700" fill="#e6edf3">How a practice set is made</text><text x="24" y="222" font-size="11.5" fill="#8b949e">Every estimate uses only answers given before it; the replay refits the model each Monday on the answers known by then.</text>
</svg>
